name: CI

# PR と main への push で動かす。文書だけの変更では Go の検査を飛ばす (changes ジョブが決める)。
# ブランチ保護の必須の検査には、最後の ci-ok だけを指定する。飛ばしたジョブがあっても、失敗がなければ通る
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 変更の判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # PR の変更したファイルを API で読むため
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 文書のほかに 1 つでも変更があれば code を true にする
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  go:
    name: Go の検査 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows が主な対象なので、PR でも省かない
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      # 製品のコードを足すまでは、Go のパッケージがなく go vet と go test が失敗するので飛ばす
      - id: packages
        run: |
          if [ -n "$(go list ./... 2>/dev/null)" ]; then echo "exist=true" >> "$GITHUB_OUTPUT"; else echo "exist=false" >> "$GITHUB_OUTPUT"; fi
      - name: 整形
        if: steps.packages.outputs.exist == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt -w で整形してください:"; echo "$unformatted"; exit 1; fi
      - if: steps.packages.outputs.exist == 'true'
        run: go vet ./...
      - if: steps.packages.outputs.exist == 'true'
        run: go build ./...
      - if: steps.packages.outputs.exist == 'true' && runner.os != 'Linux'
        run: go test ./...
      # 競合の検査は cgo が要り遅いので、Linux だけで動かす
      - if: steps.packages.outputs.exist == 'true' && runner.os == 'Linux'
        run: go test -race ./...

  commitlint:
    name: コミットメッセージの検査
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PR に含まれるコミットは、そのまま main の履歴に残る
      - name: PR のコミット
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # merge commit のメッセージは PR のタイトルになるので、同じ決まりで検査する
      - name: PR のタイトル
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  secrets:
    name: 秘密情報の混入検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks の GitHub Action は組織のリポジトリではライセンスキーが要るので、CLI を直接動かす
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  ci-ok:
    name: CI の結果
    if: always()
    needs: [changes, go, commitlint, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失敗か中止のジョブがないかを確かめる
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
