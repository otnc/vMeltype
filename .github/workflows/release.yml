name: リリース

# バージョンを入れて手で起動すると、CI が通った main のコミットから配布物を作り、GitHub のリリースとタグを作って公開する。
# 作者がバージョンを入れて起動することを公開の承認とし、下書きは挟まない。バージョンに - があれば (0.1.0-pre.1 など) プレリリースにする
on:
  workflow_dispatch:
    inputs:
      version:
        description: バージョン (0.1.0、0.1.0-pre.1 など。先頭の v は付けない)
        required: true
        type: string
      sha:
        description: 配布物を作るコミット (空なら main の最新)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: リリースの作成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # リリースとタグを作る
      contents: write
      # 配布物の証明 (artifact attestation) を作る
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || 'main' }}
          # main に含まれるかを確かめ、リリースノートで前のバージョンからの変更を並べるので、履歴とタグをすべて取る
          fetch-depth: 0
      - name: バージョンとコミットを確かめる
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$ ]]; then
            echo "バージョンは 0.1.0 や 0.1.0-pre.1 の形にしてください: $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION のタグがもうあります"; exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION のリリースか下書きがもうあります"; exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "$sha は main に含まれていません"; exit 1
          fi
          # main への push で CI が通ったコミットだけを配る
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')"
          if [ "$passed" = "0" ]; then
            echo "$sha は main への push の CI が通っていません"; exit 1
          fi
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: 配布物を作る
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          name="Meltool-$VERSION-windows"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/meltool.exe" ./cmd/meltool
          cp LICENSE "dist/$name/LICENSE.txt"
          (cd "dist/$name" && zip -X -q "../$name.zip" meltool.exe LICENSE.txt)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256" && cat "$name.zip.sha256")
          echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: リリースを作る
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "$ASSET" "$ASSET.sha256" \
            --target "$SHA" --title "Meltool $VERSION" --generate-notes "${flags[@]}"
