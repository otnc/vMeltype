name: 本家との通しの検査

# 本家の公式の配布物を取得し、使い捨ての Windows で vmeltype を通しで動かす。
# 本家の配布物と GitHub の API に依るので、ふだんの PR の CI には入れない。手で起動したときと、この検査を変えた PR でだけ動かす
on:
  pull_request:
    paths:
      - .github/workflows/upstream.yml
      - .github/scripts/upstream-portable.ps1
  workflow_dispatch:
    inputs:
      from:
        description: 先に有効にする版
        required: true
        default: "1.3.0"
      to:
        description: 切り替え先の版
        required: true
        default: "1.4.0"

permissions:
  contents: read

jobs:
  portable:
    name: portable 版 (${{ inputs.from || '1.3.0' }} から ${{ inputs.to || '1.4.0' }})
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go build -o "$env:RUNNER_TEMP\vmeltype.exe" ./cmd/vmeltype
      - name: 通しで動かす
        env:
          # 公式一覧の取得で、API の利用回数の上限に当たりにくくする
          VMELTYPE_GITHUB_TOKEN: ${{ github.token }}
          # PR では inputs がないので、既定の版を使う
          FROM: ${{ inputs.from || '1.3.0' }}
          TO: ${{ inputs.to || '1.4.0' }}
        run: ./.github/scripts/upstream-portable.ps1 -Vmeltype "$env:RUNNER_TEMP\vmeltype.exe" -From $env:FROM -To $env:TO
      - name: Meltype のログを残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meltype-logs
          path: |
            ${{ runner.temp }}/vmeltype-root/portable/app/data/*.log
          if-no-files-found: ignore
