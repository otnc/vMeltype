name: 本家との通しの検査

# 本家の公式の配布物を取得し、使い捨ての Windows で meltool を通しで動かす。
# 本家の配布物と GitHub の API に依るので、ふだんの PR の CI には入れない。手で起動したときと、この検査を変えた PR でだけ動かす
on:
  pull_request:
    paths:
      - .github/workflows/upstream.yml
      - .github/scripts/upstream-*.ps1
  workflow_dispatch:
    inputs:
      from:
        description: 先に有効にするバージョン
        required: true
        default: "1.3.0"
      to:
        description: 切り替え先のバージョン
        required: true
        default: "1.4.0"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }} (${{ inputs.from || '1.3.0' }} から ${{ inputs.to || '1.4.0' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portable 版
            script: upstream-portable.ps1
          - name: 通常版
            script: upstream-standard.ps1
          - name: 通常版 (IME あり)
            script: upstream-standard.ps1
            ime: true
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go build -o "$env:RUNNER_TEMP\meltool.exe" ./cmd/meltool
      - name: 通しで動かす
        env:
          # 公式一覧の取得で、API の利用回数の上限に当たりにくくする
          MELTOOL_GITHUB_TOKEN: ${{ github.token }}
          # PR では inputs がないので、既定のバージョンを使う
          FROM: ${{ inputs.from || '1.3.0' }}
          TO: ${{ inputs.to || '1.4.0' }}
          SCRIPT: ${{ matrix.script }}
          IME: ${{ matrix.ime || false }}
        run: |
          $arguments = @{ Meltool = "$env:RUNNER_TEMP\meltool.exe"; From = $env:FROM; To = $env:TO }
          if ($env:IME -eq 'true') { $arguments.Ime = $true }
          & "./.github/scripts/$env:SCRIPT" @arguments
      - name: Meltype のログを残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meltype-logs-${{ strategy.job-index }}
          # portable 版は実行先の隣の data、通常版は LocalAppData の Meltype にログを書く
          path: |
            ${{ runner.temp }}/meltool-root/portable/app/data/*.log
            ~/AppData/Local/Meltype/*.log
          if-no-files-found: ignore
